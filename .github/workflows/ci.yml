name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        shell: bash
        # The report is piped through tee, so pipefail is required: without it the
        # pipeline would exit with tee's status and a red `node --test` would pass.
        run: |
          set -o pipefail
          node --test --test-reporter=tap 2>&1 | tee /tmp/node-test.tap
          # The TAP summary is asserted explicitly: a summary line that moves or
          # changes shape must fail the job instead of passing on a green pipeline.
          # The count is pinned to the actual suite size (raise it when tests are
          # added) so deleting or skipping a test file turns CI red instead of
          # passing on a green pipeline.
          pass=$(grep -E '^# pass [0-9]+$' /tmp/node-test.tap | awk '{print $3}')
          tests=$(grep -E '^# tests [0-9]+$' /tmp/node-test.tap | awk '{print $3}')
          [ -n "$pass" ] || { echo "::error::node --test printed no pass summary"; exit 1; }
          [ "$pass" = "$tests" ] || { echo "::error::pass ($pass) != tests ($tests)"; exit 1; }
          [ "$pass" -ge 79 ] || { echo "::error::only $pass tests ran; expected at least 79"; exit 1; }
          grep -Eq '^# fail 0$' /tmp/node-test.tap \
            || { echo "::error::node --test reported a non-zero fail count"; exit 1; }
          grep -Eq '^# cancelled 0$' /tmp/node-test.tap \
            || { echo "::error::node --test reported a non-zero cancelled count"; exit 1; }

  python-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render review page from example data
        run: python skills/batch-review-table/scripts/build_review.py --data examples/items.json --out /tmp/review.html
      - name: The template placeholder must be replaced
        run: |
          if grep -q 'REVIEW_DATA' /tmp/review.html; then
            echo "template placeholder was not replaced" >&2
            exit 1
          fi
          if grep -q 'REVIEW_PATH' /tmp/review.html; then
            echo "the FILE_PATH placeholder was not replaced" >&2
            exit 1
          fi
          grep -q '验收：文件复制' /tmp/review.html
      - name: The payload escapes U+2028/U+2029
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'skills/batch-review-table/scripts')
          from build_review import js_json
          out = js_json({'a': 'x' + chr(0x2028) + 'y' + chr(0x2029) + 'z'})
          assert chr(0x2028) not in out and chr(0x2029) not in out, out
          assert chr(92) + 'u2028' in out and chr(92) + 'u2029' in out, out
          print('U+2028/U+2029 escaped')
          PY
      - name: Reviewer text cannot close the page's inline <script>
        shell: bash
        # Items are embedded into the page's inline <script> as a JSON literal, so
        # reviewer-supplied text such as </script><script>alert(1)</script> must be
        # escaped. A raw "</script>" in that block would end the script early and run
        # the injected markup, so the checks below fail closed on a regression.
        run: |
          set -o pipefail
          cat > /tmp/inject-items.json <<'JSON'
          {
            "id": "inject",
            "title": "P0 </script><script>alert('brx')</script> tail",
            "items": [
              {
                "id": 1,
                "type": "confirm",
                "op": "P0 </script><script>alert('brx')</script> tail",
                "expect": "same text"
              }
            ]
          }
          JSON
          python skills/batch-review-table/scripts/build_review.py --data /tmp/inject-items.json --out /tmp/inject.html
          if grep -Fq '</script><script>alert' /tmp/inject.html; then
            echo "::error::reviewer text closed the inline <script>: raw </script> reached the page"
            exit 1
          fi
          # The payload must really reach the page, escaped — otherwise the rest of
          # this step would pass vacuously.
          grep -Fq '<\/script><script>alert' /tmp/inject.html \
            || { echo "::error::the reviewer payload was not embedded in the page"; exit 1; }
          # The page must keep exactly the script close tags its template has; any
          # extra one came from the payload.
          got=$(grep -o -F '</script>' /tmp/inject.html | wc -l | tr -d ' ')
          want=$(grep -o -F '</script>' skills/batch-review-table/assets/review.html | wc -l | tr -d ' ')
          if [ "$got" != "$want" ]; then
            echo "::error::the payload added </script> tags (page: $got, template: $want)"
            exit 1
          fi
          echo "OK: $got script tag close(s), reviewer payload stayed escaped"
      - name: Compiled collector exists
        run: python -m py_compile skills/batch-review-table/scripts/collect_server.py
