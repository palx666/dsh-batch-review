- insert:
    - id: dsh-batch-review
      name: dsh-batch-review
      # Tunables. Edit these in your profile's patch layer; this file only ships
      # the defaults.
      config:
        # Reviews with at least this many items use the dock panel instead of
        # the native card. 2 = two or more use the panel; 1 = even one does.
        panelThreshold: 2
        # Hard rejection above this many items: the tool refuses and tells the
        # caller to split the batch. The hard ceiling is 500 (human review time),
        # so a larger value is rejected at load time rather than silently capped.
        maxItems: 100
        # Above this many rows the panel lets the browser skip off-screen
        # layout/paint (content-visibility: auto); every row keeps its real
        # height. Hard floor 50: below that the virtual path is a test rig, not
        # a setting, and small batches fit one screen anyway. Hard ceiling 2000.
        virtualThreshold: 500
        # How long the panel waits for an answer before returning a cancelled
        # review (never an implicit pass).
        panelTimeoutMs: 900000
        # Largest panel request body accepted, in bytes. Hard ceiling 128 MB.
        maxBodyBytes: 67108864
        # `persist` is model-supplied: by default it may only write inside the
        # host process cwd subtree. Set true to allow any path on disk.
        allowExternalPersist: false
